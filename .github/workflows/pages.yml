name: Mirror Docs to Root (for GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mirror docs/ to root for Pages
        run: |
          set -e
          # Get list of all Q-folders in docs
          echo "Mirroring docs/ to root for GitHub Pages..."

          # Copy index.html
          cp docs/index.html index.html

          # Mirror each directory (except fonts and 02-libri-deperditi)
          for d in docs/*/; do
            name=$(basename "$d")
            # Skip heavy/data folders
            case "$name" in
              fonts) continue ;;
            esac
            # Remove old copy if exists
            if [ -d "$name" ] && [ ! -L "$name" ]; then
              rm -rf "$name"
            fi
            if [ -L "$name" ]; then
              rm "$name"
            fi
            # Copy
            cp -r "$d" "$name"
            echo "Mirrored: $name"
          done

      - name: Commit and push
        run: |
          git config user.name "archivum-pages-bot"
          git config user.email "archivum-pages-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Mirror docs/ to root for GitHub Pages"
            git push origin HEAD:main
          fi
