name: build-corpus
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-corpus
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sources (Q1)
        run: bash corpus/tools/fetch_sources.sh
      - name: Build Quran
        run: python3 corpus/tools/build_quran.py --src quran_uthmani.txt --ru quran_ru_krachkovsky.txt --out /tmp/build
      - name: Verify integrity
        run: python3 corpus/tools/verify.py quran_uthmani.txt 6236
      - name: Assemble docs/
        # docs/quran/ — выверенная витрина (свой шаблон + quran/index.html).
        # Страницы из /tmp/build/site/quran сюда НЕ копируются: старый шаг
        # "rm -rf docs/quran && cp -r ..." затирал вёрстку и удалял quran/index.html.
        run: |
          mkdir -p docs/scriptorium
          cp scriptorium/index.html docs/scriptorium/index.html
      - name: Commit site
        run: |
          git config user.name "archivum-bot"
          git config user.email "archivum-bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "AUTO: пересборка сайта корпуса"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
